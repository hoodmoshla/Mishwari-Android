name: Android CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee ci-build.log
      - name: Verify debug APK and write checksum
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/Mishwari-0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ci-artifacts/Mishwari-0.1.0-debug.apk | tee ci-artifacts/apk-signature.txt
          cd ci-artifacts
          sha256sum Mishwari-0.1.0-debug.apk > SHA256SUMS.txt
      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mishwari-debug-${{ github.run_number }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve build logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            ci-build.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 30
          if-no-files-found: warn
